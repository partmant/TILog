server:
  # 배포 서버에서 QuoteGuard 백엔드(8080)와 같은 EC2를 공유하므로 포트가 겹치지 않도록
  # SERVER_PORT 환경변수로 재정의 가능하게 둔다 (로컬 개발 기본값은 그대로 8080).
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tilog-backend
  datasource:
    # DB_HOST/DB_PORT는 배포 서버의 Docker 네트워크 구성(host 네트워킹 여부)에 따라
    # 값이 달라질 수 있어 환경변수로 분리했다 (로컬 개발 기본값은 localhost:3306 유지).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tilog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false
  profiles:
    active: local
# JWT 설정
# - secret: Base64로 인코딩된 256bit 이상의 키 (운영에서는 반드시 환경변수로 주입)
# - 아래 기본값은 로컬 개발용. 운영 배포 시 JWT_SECRET 환경변수로 반드시 교체할 것
jwt:
  secret: ${JWT_SECRET:dGlsb2ctZGVmYXVsdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LXVzZS1lbnYtaW4tcHJvZHVjdGlvbi1leGFtcGxlLW9ubHk=}
  access-token-validity-seconds: 1800   # 30분
  refresh-token-validity-seconds: 1209600   # 14일

gemini:
  api:
    key: ${GOOGLE_GEMINI_API_KEY:}
    # gemini-2.5-flash가 신규 키에서 404(사용 불가)로 막혀 안정적인 별칭으로 전환.
    # "-latest" 별칭은 Google이 안정된 최신 Flash 모델로 자동 교체해주므로,
    # 이후 특정 버전이 폐기돼도 이 값을 계속 바꿔줄 필요가 없다.
    model: ${GEMINI_API_MODEL:gemini-flash-latest}

# CORS 허용 origin (콤마 구분)
# - 기본값에 배포 도메인(tilog.n-e.kr)을 포함해 별도 환경변수 없이도 동작
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:https://tilog.n-e.kr,http://localhost:3000,http://localhost:5173}

# 포트폴리오 공개 데모 계정 설정
# - demo.enabled=true일 때만 DemoAccountInitializer/DemoDataResetScheduler가 동작한다.
# - demo.account.password가 비어 있으면(기본값) 데모 계정이 생성되지 않으므로,
#   운영 배포 시에는 DEMO_ENABLED/DEMO_ACCOUNT_PASSWORD 환경변수를 반드시 채워야 한다.
demo:
  enabled: ${DEMO_ENABLED:false}
  account:
    email: ${DEMO_ACCOUNT_EMAIL:demo@tilog.kr}
    password: ${DEMO_ACCOUNT_PASSWORD:}
    nickname: ${DEMO_ACCOUNT_NICKNAME:데모_방문자}
  reset:
    cron: ${DEMO_RESET_CRON:0 0 0 * * *}   # 매일 자정

spring:
  application:
    name: tilog-backend

  datasource:
    url: jdbc:mysql://localhost:3306/tilog?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # update nono
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false